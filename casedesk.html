<!-- casedesk-web, the reading copy of case logs, build b279df96b87e, casedesk.nvim 6fc05db, lib.nvim 4f385bb. Third-party code inside: Lua 5.4 and wasmoon 1.16.0 (MIT); see THIRD-PARTY-NOTICES.md -->
<style>/* casedesk.html: menu bar on top, the reading copy, the side bar on the right, the status line at the bottom. */

:root {
  color-scheme: light dark;
  --bg: #fbfbfa;
  --fg: #1f2328;
  --dim: #6e7781;
  --line: #d8dee4;
  --panel: #f3f4f6;
  --hover: #e8ecf1;
  --cursor: #dbe9ff;
  --accent: #0b5cad;
  --error: #c62828;
  --warn: #9a6700;
  --known: #6a3fb5;
  --gap: #b35900;
  --key: #0550ae;
  --value: #116329;
  --mono: ui-monospace, 'Cascadia Mono', Consolas, 'Liberation Mono', monospace;
  --sans: system-ui, 'Segoe UI', sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16191d;
    --fg: #d6dbe0;
    --dim: #8b949e;
    --line: #30363d;
    --panel: #1d2127;
    --hover: #262c34;
    --cursor: #1f3550;
    --accent: #6cb6ff;
    --error: #ff7b72;
    --warn: #d29922;
    --known: #c4a7ff;
    --gap: #f0883e;
    --key: #79c0ff;
    --value: #7ee787;
  }
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.4 var(--sans);
}

#app {
  display: grid;
  /* one column no wider than the window: a long log line scrolls inside the reading copy */
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) auto;
  height: 100vh;
}

body[data-busy] {
  cursor: progress;
}

button {
  font: inherit;
  color: inherit;
}

/* ── menu bar ── */

.menubar {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 2px 8px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  user-select: none;
}

.menu {
  position: relative;
}

.menu-button {
  border: 0;
  background: none;
  padding: 4px 10px;
  border-radius: 4px;
  cursor: default;
}

.menu-button:hover,
.menu-button[aria-expanded='true'] {
  background: var(--hover);
}

.menu-button::after {
  content: ' ▾';
  color: var(--dim);
  font-size: 0.8em;
}

.menu-panel {
  position: absolute;
  top: 100%;
  left: 0;
  z-index: 10;
  min-width: 280px;
  max-width: 460px;
  padding: 4px 0;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  box-shadow: 0 6px 24px rgb(0 0 0 / 0.18);
}

.menu-item {
  display: grid;
  grid-template-columns: 1.4em 1fr auto;
  width: 100%;
  gap: 4px;
  border: 0;
  background: none;
  padding: 4px 12px 4px 6px;
  text-align: left;
  cursor: default;
}

.menu-item:hover:not([disabled]),
.menu-item:focus-visible {
  background: var(--hover);
  outline: none;
}

.menu-item[disabled] {
  color: var(--dim);
}

.menu-item .key {
  color: var(--dim);
  font-family: var(--mono);
  font-size: 0.9em;
}

.menu-sep {
  height: 1px;
  margin: 4px 0;
  background: var(--line);
}

.menu-note {
  padding: 2px 12px 2px 28px;
  color: var(--dim);
  font-size: 0.85em;
}

.where {
  margin-left: auto;
  color: var(--dim);
  font-family: var(--mono);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── body ── */

.workspace {
  display: flex;
  min-height: 0;
  min-width: 0;
}

.log {
  flex: 1;
  min-width: 0;
  overflow: auto;
  outline: none;
}

.splitter {
  width: 5px;
  cursor: col-resize;
  background: var(--line);
}

.sidebar {
  flex: none;
  overflow: auto;
  padding: 6px 10px;
  background: var(--panel);
  font-size: 13px;
}

/* ── start and picker ── */

.start,
.picker {
  max-width: 820px;
  padding: 24px 32px;
}

.start h1,
.picker h1 {
  font-size: 20px;
  margin: 0 0 8px;
}

.hint {
  color: var(--dim);
}

.small {
  font-size: 0.85em;
}

.primary {
  background: var(--accent);
  color: #fff;
  border: 0;
  border-radius: 4px;
  padding: 6px 14px;
}

.link {
  border: 0;
  background: none;
  padding: 0;
  color: var(--accent);
  text-decoration: underline;
  cursor: pointer;
  font-family: var(--mono);
}

.recent ul {
  list-style: none;
  padding: 0;
}

.recent li {
  margin: 4px 0;
}

table.logs {
  border-collapse: collapse;
  margin: 8px 0 12px;
}

table.logs td,
table.logs th {
  padding: 2px 10px 2px 0;
  text-align: left;
}

table.logs td.size {
  color: var(--dim);
  text-align: right;
}

/* ── the reading copy ── */

.loghead {
  position: sticky;
  top: 0;
  z-index: 1;
  padding: 4px 8px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.format {
  font-weight: 600;
}

.dim {
  color: var(--dim);
}

.rows {
  font-family: var(--mono);
  font-size: 13px;
  padding: 2px 0 40vh;
}

.row {
  white-space: pre;
  padding: 0 8px;
  cursor: default;
}

.row:hover {
  background: var(--hover);
}

.row.cursor {
  background: var(--cursor);
}

.lnum {
  color: var(--dim);
}

.mark {
  color: var(--accent);
  cursor: pointer;
}

.time,
.delta,
.source {
  color: var(--dim);
}

.kind {
  color: var(--key);
  display: inline-block;
  min-width: 5ch;
}

.tag {
  color: var(--accent);
}

.rep {
  color: var(--known);
}

.note {
  color: var(--warn);
}

.known {
  color: var(--known);
}

.lvl-error .kind,
.lvl-error .text,
.lvl-fatal .kind,
.lvl-fatal .text {
  color: var(--error);
}

.lvl-warn .kind,
.lvl-warn .text {
  color: var(--warn);
}

.gapline {
  color: var(--gap);
}

.empty {
  padding: 12px;
  color: var(--dim);
}

/* groups of casedesk.nvim's view (view/render.lua) */
.hl-CaselogKey,
.hl-CaselogId {
  color: var(--key);
}
.hl-CaselogValue,
.hl-CaselogText {
  color: var(--value);
}
.hl-CaselogInfo,
.hl-CaselogAttr,
.hl-CaselogBounds,
.hl-CaselogSource {
  color: var(--dim);
}
.hl-CaselogNote {
  color: var(--warn);
}
.hl-CaselogException,
.hl-CaselogError {
  color: var(--error);
}
.hl-CaselogOwn,
.hl-CaselogClass {
  color: var(--accent);
  font-weight: 600;
}
.hl-CaselogFlag {
  color: var(--known);
}

/* ── side bar ── */

.sidebar h2 {
  font-size: 13px;
  margin: 4px 0 8px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--dim);
}

.group {
  margin-bottom: 6px;
}

.group summary {
  font-weight: 600;
  cursor: pointer;
  padding: 2px 0;
}

.group[data-group='errors'] summary {
  color: var(--error);
}

.group[data-group='warnings'] summary {
  color: var(--warn);
}

.group[data-group='known'] summary {
  color: var(--known);
}

.group ul {
  list-style: none;
  margin: 2px 0 6px;
  padding: 0 0 0 12px;
}

.jump {
  display: block;
  width: 100%;
  border: 0;
  background: none;
  padding: 1px 4px;
  text-align: left;
  font-family: var(--mono);
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
  border-radius: 3px;
}

.jump:hover {
  background: var(--hover);
}

.known-item {
  margin: 4px 0 8px 12px;
  padding-left: 8px;
  border-left: 3px solid var(--known);
}

.known-item.sev-error {
  border-color: var(--error);
}

.known-item.sev-info {
  border-color: var(--dim);
}

.known-title {
  font-weight: 600;
}

.explain {
  white-space: pre-wrap;
  margin: 2px 0;
}

.links a {
  color: var(--accent);
}

.links .case {
  font-family: var(--mono);
}

.known-item ul {
  padding-left: 0;
}

/* ── status line and dialogs ── */

.status {
  display: flex;
  gap: 16px;
  padding: 3px 8px;
  background: var(--panel);
  border-top: 1px solid var(--line);
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
}

.status .facts {
  color: var(--dim);
  overflow: hidden;
  text-overflow: ellipsis;
}

.status .message {
  margin-left: auto;
  overflow: hidden;
  text-overflow: ellipsis;
}

.dialog {
  min-width: 420px;
  max-width: min(90vw, 1100px);
  max-height: 85vh;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  color: var(--fg);
  padding: 12px 16px;
}

.dialog::backdrop {
  background: rgb(0 0 0 / 0.3);
}

.dialog-head {
  display: flex;
  align-items: center;
  gap: 12px;
}

.dialog-head h2 {
  font-size: 15px;
  margin: 0;
  flex: 1;
}

.dialog .close {
  border: 0;
  background: none;
  font-size: 20px;
  cursor: pointer;
}

.dialog label {
  display: block;
  margin: 8px 0;
}

.dialog input,
.dialog select {
  font: inherit;
  color: inherit;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 3px 6px;
}

.buttons {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.buttons button:not(.primary) {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 6px 14px;
}

pre.original {
  font-family: var(--mono);
  font-size: 12px;
  white-space: pre;
  overflow: auto;
  max-height: 70vh;
}

table.keys td {
  padding: 2px 12px 2px 0;
}

kbd {
  font-family: var(--mono);
}
</style>
</head>

<script type="module">const PAGE = {"build":"b279df96b87e","engine":"casedesk.nvim 6fc05db, lib.nvim 4f385bb"};
// The folder the person works in, in an app's web variant: choosing it (File System Access API), the folders used
// before (their handles in IndexedDB), and the permission to read them, which the browser asks again after a restart.
//
// Everything that is the browser's comes in by argument (the window, the key-value store), so Node runs this without
// one. The probe of tasks-web (2026-10-28) showed on the workstation what this relies on: the handle survives a reload
// and a restart of Chrome, the permission is `granted` after a reload and `prompt` after a restart, and only a click
// (`requestPermission` inside a user gesture) brings it back.
//
// Every local HTML file shares one origin (file://), and with it IndexedDB and the stored handles with their
// permission. So each app keeps its handles in a database of its own name (`idbKeyValue(factory, name)`), and the
// picker remembers its start folder under an id of the app's own (`pickFolder(win, { id })`).

const MAX_RECENT = 5;

/** Whether this page can choose a folder at all. A policy that blocks it shows only when the picker is called. */
function pickerSupport(win) {
  if (typeof win.showDirectoryPicker !== 'function') return 'missing';
  if (win.isSecureContext === false) return 'insecure';
  return 'ok';
}

/** One line of text of an error: no control characters, cut short. */
function oneLine(error, max = 200) {
  const raw = error instanceof Error ? `${error.name}: ${error.message}` : String(error);
  // eslint-disable-next-line no-control-regex
  return raw.replace(/[\u0000-\u001f\u007f-\u009f]+/g, ' ').trim().slice(0, max);
}

function nameOf(error) {
  return typeof error === 'object' && error !== null && typeof error.name === 'string' ? error.name : '';
}

/**
 * Ask the person for a folder. Must run inside a click: the browser refuses the picker without one. `id` is the app's
 * (the picker starts at the folder last chosen under it), `mode` what is asked for.
 */
async function pickFolder(win, { id, mode }) {
  if (typeof win.showDirectoryPicker !== 'function') return { kind: 'failed', message: 'showDirectoryPicker is missing' };
  try {
    return { kind: 'picked', handle: await win.showDirectoryPicker({ id, mode }) };
  } catch (error) {
    const name = nameOf(error);
    if (name === 'AbortError') return { kind: 'cancelled' };
    // A policy of the organisation, or no click behind the call: the picker is refused, not failed.
    if (name === 'SecurityError' || name === 'NotAllowedError') return { kind: 'blocked', message: oneLine(error) };
    return { kind: 'failed', message: oneLine(error) };
  }
}

/** The permission a stored handle has now for `mode`; `gone` when the folder does not exist any more. */
async function permissionOf(handle, mode) {
  try {
    return await handle.queryPermission({ mode });
  } catch (error) {
    return nameOf(error) === 'NotFoundError' ? 'gone' : 'denied';
  }
}

/** Ask for the permission again. Must run inside a click (the first thing the click handler does). */
async function grantAccess(handle, mode) {
  try {
    return await handle.requestPermission({ mode });
  } catch (error) {
    return nameOf(error) === 'NotFoundError' ? 'gone' : 'denied';
  }
}

// -- the folders used before ------------------------------------------------------------------------------------

const RECENT_KEY = 'recent';

/** Whether a stored value is a directory handle this module can use. */
function isHandle(value) {
  const h = value;
  return (
    typeof h === 'object' &&
    h !== null &&
    h.kind === 'directory' &&
    typeof h.values === 'function' &&
    typeof h.queryPermission === 'function' &&
    typeof h.requestPermission === 'function'
  );
}

/** A name for the list: what the folder is called, without control characters, cut short. */
function displayName(name) {
  // eslint-disable-next-line no-control-regex
  return (typeof name === 'string' ? name : '').replace(/[\u0000-\u001f\u007f-\u009f]+/g, ' ').trim().slice(0, 200);
}

class RecentFolders {
  kv;
  max;
  newId;

  constructor(kv, opts = {}) {
    this.kv = kv;
    this.max = opts.max ?? MAX_RECENT;
    this.newId = opts.newId ?? (() => crypto.randomUUID());
  }

  /** The folders, the one used last first. What is stored is checked: an entry that is not a folder is dropped. */
  async list() {
    let raw;
    try {
      raw = await this.kv.get(RECENT_KEY);
    } catch {
      return [];
    }
    if (!Array.isArray(raw)) return [];
    const out = [];
    const seen = new Set();
    for (const item of raw) {
      if (typeof item !== 'object' || item === null) continue;
      const { id, handle, lastUsed } = item;
      if (typeof id !== 'string' || id === '' || seen.has(id) || !isHandle(handle)) continue;
      seen.add(id);
      out.push({
        id,
        name: displayName(handle.name),
        handle,
        lastUsed: typeof lastUsed === 'number' && Number.isFinite(lastUsed) ? lastUsed : 0,
      });
    }
    return out.sort((a, b) => b.lastUsed - a.lastUsed).slice(0, this.max);
  }

  /** Remember `handle` as used at `now`: the same folder as one in the list moves up, a new one is added. */
  async remember(handle, now) {
    const all = await this.list();
    let same;
    for (const entry of all) {
      if (await sameFolder(entry.handle, handle)) {
        same = entry;
        break;
      }
    }
    const kept = all.filter((entry) => entry !== same);
    const entry = { id: same?.id ?? this.newId(), name: displayName(handle.name), handle, lastUsed: now };
    await this.save([entry, ...kept].slice(0, this.max));
    return entry;
  }

  async forget(id) {
    await this.save((await this.list()).filter((entry) => entry.id !== id));
  }

  save(list) {
    return this.kv.put(RECENT_KEY, list.map(({ id, handle, lastUsed }) => ({ id, handle, lastUsed })));
  }
}

async function sameFolder(a, b) {
  if (a === b) return true;
  try {
    return typeof a.isSameEntry === 'function' ? await a.isSameEntry(b) : false;
  } catch {
    return false;
  }
}

// -- IndexedDB ---------------------------------------------------------------------------------------------------

/**
 * One object store, handles by key, in the database `name`: the app's own (the origin is shared by every local file).
 * A directory handle can be stored in IndexedDB, in no other place.
 */
function idbKeyValue(factory, name, store = 'handles') {
  if (typeof name !== 'string' || name === '') throw new Error('idbKeyValue: the name of the database is missing');
  // One connection for the page; a failed open is tried again next time.
  let opened = null;
  const db = () => {
    opened ??= new Promise((resolve, reject) => {
      const request = factory.open(name, 1);
      request.onupgradeneeded = () => request.result.createObjectStore(store);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    }).catch((error) => {
      opened = null;
      throw error;
    });
    return opened;
  };
  const run = async (mode, make) => {
    const d = await db();
    return new Promise((resolve, reject) => {
      const tx = d.transaction(store, mode);
      const request = make(tx.objectStore(store));
      tx.oncomplete = () => resolve(request.result);
      tx.onerror = () => reject(tx.error);
      // An aborted transaction (quota) fires no error of its own.
      tx.onabort = () => reject(tx.error ?? new Error('transaction aborted'));
    });
  };
  return {
    get: (key) => run('readonly', (s) => s.get(key)),
    put: async (key, value) => {
      await run('readwrite', (s) => s.put(value, key));
    },
  };
}

// A folder chosen through `<input type="file" webkitdirectory>`: the way in for browsers without `showDirectoryPicker`
// (Firefox, Safari). The browser hands over a flat list of files, each with its path below the chosen folder
// (`webkitRelativePath`); there is no handle, so the folder cannot be written to, kept for the next visit or looked at
// again. This module turns the list into a read-only folder a reader walks like any other.
//
// Everything that is the browser's comes in by argument (the document), so Node runs this without one.



class Dir {
  kind = 'directory';
  name;
  dirs = new Map();
  files = new Map();

  constructor(name) {
    this.name = name;
  }

  async *values() {
    for (const dir of this.dirs.values()) yield dir;
    for (const file of this.files.values()) yield file;
  }
}

function fileHandle(file, name) {
  return {
    kind: 'file',
    name,
    getFile: async () => ({ size: file.size, lastModified: file.lastModified, arrayBuffer: () => file.arrayBuffer() }),
  };
}

/**
 * The browser handed over files without their place in the folder (`webkitRelativePath` empty): Safari on an iPhone or
 * iPad takes the input but gives single files, not a folder. The page tells the person so, in their language.
 */
class NoPathsError extends Error {
  constructor() {
    super('the browser did not tell where in the folder a file lies');
    this.name = 'NoPathsError';
  }
}

/**
 * The folder the files lie in. The first segment of each path is the name of the chosen folder; a list whose files do
 * not share one (it cannot happen with one chosen folder) is refused rather than guessed at.
 */
function folderOfFiles(files) {
  let root = null;
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    const segments = file.webkitRelativePath.split('/');
    // A file without a folder in its path: the browser did not give a folder.
    if (segments.length < 2) throw new NoPathsError();
    const top = segments[0];
    root ??= new Dir(top);
    if (top !== root.name) throw new Error('the files do not come from one folder');
    let dir = root;
    for (const part of segments.slice(1, -1)) {
      let next = dir.dirs.get(part);
      if (!next) {
        next = new Dir(part);
        dir.dirs.set(part, next);
      }
      dir = next;
    }
    const name = segments[segments.length - 1];
    dir.files.set(name, fileHandle(file, name));
  }
  // An empty folder lists no file at all: the name is lost with it.
  const out = root ?? new Dir('');
  return Object.assign(out, { count: files.length });
}

/** Whether this browser can hand over a folder through an input (Firefox 50+, Safari 11.1+, Chrome and Edge as well). */
function inputFolderSupport(doc) {
  if (!doc || typeof doc.createElement !== 'function') return false;
  try {
    return 'webkitdirectory' in doc.createElement('input');
  } catch {
    return false;
  }
}

/**
 * Ask for a folder through an input. Must run inside a click: the browser opens the dialog only for one. Resolves when
 * the person chose (`change`) or closed the dialog (`cancel`; a browser that does not send it leaves the page where it
 * is, on the way in, to choose again).
 */
function pickFolderByInput(doc) {
  return new Promise((resolve) => {
    let input;
    try {
      input = doc.createElement('input');
      input.type = 'file';
      input.webkitdirectory = true;
      input.multiple = true;
      input.hidden = true;
      doc.body?.appendChild(input);
    } catch (error) {
      resolve({ kind: 'failed', message: oneLine(error) });
      return;
    }
    const done = (result) => {
      input.remove?.();
      resolve(result);
    };
    input.addEventListener('cancel', () => done({ kind: 'cancelled' }), { once: true });
    input.addEventListener(
      'change',
      () => {
        const files = input.files;
        if (!files || files.length === 0) return done({ kind: 'empty' });
        try {
          done({ kind: 'picked', folder: folderOfFiles(files) });
        } catch (error) {
          done(error instanceof NoPathsError ? { kind: 'no_paths' } : { kind: 'failed', message: oneLine(error) });
        }
      },
      { once: true },
    );
    try {
      input.click();
    } catch (error) {
      done({ kind: 'failed', message: oneLine(error) });
    }
  });
}

// The page side of the engine, shared by the pages that run the Lua core: the parts the page carries (base64 of gzip,
// see appkit-web's `assemble`) and the worker the core runs in. build/pack.mjs puts this file into each such page as a
// classic script (`export` dropped).

/** base64 -> bytes: `Uint8Array.fromBase64` where the browser has it, else `atob`. Both skip the line breaks. */
function base64Bytes(text) {
  if (typeof Uint8Array.fromBase64 === 'function') return Uint8Array.fromBase64(text.replace(/\s+/g, ''));
  const binary = atob(text.replace(/\s+/g, ''));
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

async function gunzip(bytes) {
  const source = new ReadableStream({
    start(controller) {
      controller.enqueue(bytes);
      controller.close();
    },
  });
  return new Uint8Array(await new Response(source.pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
}

/** One part of the page: `{ gz, data }`, the size packed and the bytes. */
async function unpackPart(id) {
  const node = document.getElementById(id);
  if (!node) throw new Error(`the page lacks its part "${id}"`);
  const bytes = base64Bytes(node.textContent);
  return { gz: bytes.length, data: await gunzip(bytes) };
}

/**
 * A classic worker from a blob: a module worker from a blob does not start on a page opened from disk. `call` answers
 * `{ text, code, ms }`; `blobs` are texts the request names by number (`blob: 1` is the first).
 */
function startEngineWorker(source) {
  const url = URL.createObjectURL(new Blob([source], { type: 'text/javascript' }));
  const worker = new Worker(url, { type: 'classic' });
  const pending = new Map();
  let next = 1;
  let ready;
  const readyP = new Promise((resolve, reject) => {
    ready = { resolve, reject };
  });
  worker.onmessage = (e) => {
    const m = e.data;
    if (m.type === 'ready') ready.resolve(m.ms);
    else if (m.type === 'result') {
      pending.get(m.id)?.resolve(m);
      pending.delete(m.id);
    } else if (m.type === 'error') {
      if (m.id && pending.has(m.id)) {
        pending.get(m.id).reject(new Error(m.message));
        pending.delete(m.id);
      } else ready.reject(new Error(m.message));
    } else if (m.type === 'log') console.log('engine:', m.level, m.message);
  };
  worker.onerror = (e) => ready.reject(new Error(e.message || 'worker failed to start (event ' + e.type + ')'));
  return {
    worker,
    ready: readyP,
    call(method, params, blobs) {
      const id = next++;
      return new Promise((resolve, reject) => {
        pending.set(id, { resolve, reject });
        worker.postMessage({
          type: 'call',
          id,
          method,
          request: params === undefined ? null : JSON.stringify({ params }),
          blobs: blobs ?? [],
        });
      });
    },
  };
}

/** Unpack the engine parts of the page and start the core: the worker, ready for `call`. */
async function startEngine() {
  const names = ['worker', 'wasm', 'bundle'];
  const got = await Promise.all(names.map(unpackPart));
  const parts = Object.fromEntries(names.map((n, i) => [n, got[i].data]));
  const dec = new TextDecoder();
  const w = startEngineWorker(dec.decode(parts.worker));
  const wasm = parts.wasm.buffer;
  w.worker.postMessage(
    { type: 'init', wasm, bundle: JSON.parse(dec.decode(parts.bundle)) },
    [wasm],
  );
  await w.ready;
  return w;
}

// What the reading copy page needs that has nothing to do with the screen: which files of a case are logs, how a file's
// bytes become text, a label's byte spans as pieces of text, the keys as Neovim reads them. Plain functions, so that
// Node tests them (test/app.test.mjs) and build/pack.mjs puts them into the page as they are (`export` dropped).

/**
 * File extensions offered as logs: a copy of `M.EXTENSIONS` of casedesk.nvim's `lua/casedesk/logs.lua` (not part of the
 * pure core, it lists files); test/app.test.mjs checks it against the pinned commit.
 */
const LOG_EXTENSIONS = ['log', 'txt', 'out', 'ndjson', 'jsonl', 'json', 'xml', 'csv'];

/** The folder of a case the logs are in (`config.assets_dirname`). */
const ASSETS = 'assets';

/** Largest file the page reads (`casedesk.web.api.MAX_TEXT`). */
const MAX_LOG_BYTES = 64 * 1024 * 1024;

/** Whether `path` (`/`-separated, below `assets/`) is offered as a log: a log extension, no redacted copy. */
function isLogFile(path) {
  const name = String(path).split('/').at(-1) ?? '';
  if (/\.redacted\.\w+$/i.test(name)) return false;
  const ext = (name.match(/\.(\w+)$/)?.[1] ?? '').toLowerCase();
  return LOG_EXTENSIONS.includes(ext);
}

/**
 * The log files under a folder handle (`values()` of the File System Access API), path relative to it, sorted like
 * `logs.candidates` (by path). Folders deeper than `maxDepth` are not walked.
 * @param {{ values(): AsyncIterable<any> }} dir
 * @returns {Promise<{ path: string, handle: any }[]>}
 */
async function listLogs(dir, maxDepth = 8) {
  const out = [];
  const walk = async (d, prefix, depth) => {
    for await (const h of d.values()) {
      const path = prefix ? `${prefix}/${h.name}` : h.name;
      if (h.kind === 'directory') {
        if (depth < maxDepth) await walk(h, path, depth + 1);
      } else if (isLogFile(path)) {
        out.push({ path, handle: h });
      }
    }
  };
  await walk(dir, '', 0);
  return out.sort((a, b) => (a.path < b.path ? -1 : a.path > b.path ? 1 : 0));
}

/** The child folder `name` of a folder handle, or null. */
async function childFolder(dir, name) {
  for await (const h of dir.values()) if (h.kind === 'directory' && h.name === name) return h;
  return null;
}

/** The child file `name` of a folder handle, or null. */
async function childFile(dir, name) {
  for await (const h of dir.values()) if (h.kind === 'file' && h.name === name) return h;
  return null;
}

/** Which byte order a text without a BOM in UTF-16 has, from the zero bytes of its start; null when it is not UTF-16. */
function utf16Order(bytes) {
  const n = Math.min(bytes.length, 4096) & ~1;
  if (n < 4) return null;
  let even = 0;
  let odd = 0;
  for (let i = 0; i < n; i += 2) {
    if (bytes[i] === 0) even++;
    if (bytes[i + 1] === 0) odd++;
  }
  const half = n / 2;
  if (odd > half * 0.3 && even < half * 0.05) return 'utf-16le';
  if (even > half * 0.3 && odd < half * 0.05) return 'utf-16be';
  return null;
}

/**
 * A file's bytes as text, as casedesk.nvim's `logs.to_utf8` reads a log: UTF-8 (BOM dropped), UTF-16 by its BOM or by
 * its zero bytes, else Windows-1252 (logs of Windows tools that are not UTF-8).
 * @param {Uint8Array} bytes
 * @returns {{ text: string, encoding: string }}
 */
function decodeLog(bytes) {
  if (bytes[0] === 0xef && bytes[1] === 0xbb && bytes[2] === 0xbf) {
    return { text: new TextDecoder('utf-8').decode(bytes.subarray(3)), encoding: 'utf-8' };
  }
  if (bytes[0] === 0xff && bytes[1] === 0xfe) return { text: new TextDecoder('utf-16le').decode(bytes.subarray(2)), encoding: 'utf-16le' };
  if (bytes[0] === 0xfe && bytes[1] === 0xff) return { text: new TextDecoder('utf-16be').decode(bytes.subarray(2)), encoding: 'utf-16be' };
  const order = utf16Order(bytes);
  if (order) return { text: new TextDecoder(order).decode(bytes), encoding: order };
  try {
    return { text: new TextDecoder('utf-8', { fatal: true }).decode(bytes), encoding: 'utf-8' };
  } catch {
    return { text: new TextDecoder('windows-1252').decode(bytes), encoding: 'windows-1252' };
  }
}

/**
 * A label and its spans (byte ranges of its UTF-8 form, 0-based, end exclusive, with a group name, as casedesk.nvim's
 * view writes them) as pieces of text with the group of each: `[{ text, group }]`, `group` null where no span is. A
 * later span wins where two overlap; a span outside the label is cut to it.
 * @param {string} label
 * @param {[number, number, string][]} spans
 * @returns {{ text: string, group: string | null }[]}
 */
function pieces(label, spans) {
  if (!spans || spans.length === 0) return [{ text: label, group: null }];
  const bytes = new TextEncoder().encode(label);
  const group = new Array(bytes.length).fill(null);
  for (const [from, to, name] of spans) {
    for (let i = Math.max(0, from); i < Math.min(bytes.length, to); i++) group[i] = name;
  }
  const dec = new TextDecoder();
  const out = [];
  let start = 0;
  for (let i = 1; i <= bytes.length; i++) {
    // never cut inside a character: a continuation byte joins the piece before it
    if (i < bytes.length && (group[i] === group[start] || (bytes[i] & 0xc0) === 0x80)) continue;
    out.push({ text: dec.decode(bytes.subarray(start, i)), group: group[start] });
    start = i;
  }
  return out;
}

/** `1234567` -> `1.2 MB`. */
function formatSize(n) {
  if (n < 1024) return `${n} B`;
  if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} kB`;
  return `${(n / 1024 / 1024).toFixed(1)} MB`;
}

/**
 * The keys of the reading copy, as in casedesk.nvim (`log_view.keys`): action -> key sequences. `j`/`k`/`gg`/`G` move
 * as in Neovim; `<CR>` is Enter.
 */
const KEYS = {
  toggle: ['<CR>', 'za'],
  open: ['zo'],
  close: ['zc'],
  close_all: ['zM'],
  open_all: ['zR'],
  original: ['gO'],
  next_error: [']e'],
  prev_error: ['[e'],
  next_warn: [']w'],
  prev_warn: ['[w'],
  next_request: [']r'],
  prev_request: ['[r'],
  next_known: [']k'],
  prev_known: ['[k'],
  next_gap: [']g'],
  prev_gap: ['[g'],
  filter: ['gf'],
  filter_pop: ['gF'],
  filter_clear: ['g0'],
  tz: ['tz'],
  repeats: ['gr'],
  mode: ['gs'],
  help: ['g?'],
  down: ['j', '<Down>'],
  up: ['k', '<Up>'],
  first: ['gg', '<Home>'],
  last: ['G', '<End>'],
  page_down: ['<C-d>', '<PageDown>'],
  page_up: ['<C-u>', '<PageUp>'],
};

/** A `KeyboardEvent` as one key of a sequence (`j`, `G`, `<CR>`, `<C-d>`); null for a key that is none (Shift alone). */
function keyName(ev) {
  const k = ev.key;
  if (k === 'Shift' || k === 'Control' || k === 'Alt' || k === 'Meta') return null;
  const special = { Enter: '<CR>', ArrowDown: '<Down>', ArrowUp: '<Up>', Home: '<Home>', End: '<End>', PageDown: '<PageDown>', PageUp: '<PageUp>', Escape: '<Esc>' };
  let name = special[k] ?? (k.length === 1 ? k : null);
  if (name === null) return null;
  if (ev.ctrlKey && k.length === 1) name = `<C-${k.toLowerCase()}>`;
  else if (ev.altKey || ev.metaKey) return null;
  return name;
}

/**
 * Reads key sequences: `feed(key)` answers the action of a complete sequence, `pending` while a prefix of one is typed,
 * `none` for a key that starts no sequence (the prefix typed before is dropped, as Neovim does).
 */
class KeyReader {
  constructor(keys = KEYS) {
    this.map = new Map();
    for (const [action, seqs] of Object.entries(keys)) for (const s of seqs) this.map.set(s, action);
    this.prefixes = new Set();
    for (const s of this.map.keys()) {
      const parts = splitKeys(s);
      for (let i = 1; i < parts.length; i++) this.prefixes.add(parts.slice(0, i).join(''));
    }
    this.typed = '';
  }

  /** @returns {{ kind: 'action', action: string } | { kind: 'pending' } | { kind: 'none' }} */
  feed(key) {
    const seq = this.typed + key;
    if (this.map.has(seq) && !this.prefixes.has(seq)) {
      this.typed = '';
      return { kind: 'action', action: this.map.get(seq) };
    }
    if (this.prefixes.has(seq)) {
      this.typed = seq;
      return { kind: 'pending' };
    }
    this.typed = '';
    // the key alone may start or be a sequence of its own
    if (seq !== key) return this.feed(key);
    return { kind: 'none' };
  }

  reset() {
    this.typed = '';
  }
}

/** `g<CR>` -> ['g', '<CR>']. */
function splitKeys(s) {
  return s.match(/<[^>]+>|./g) ?? [];
}

/** The groups of the side bar, in their order: key of `view.groups`, title. */
const GROUPS = [
  ['errors', 'Fehler'],
  ['warnings', 'Warnungen'],
  ['exceptions', 'Exceptions'],
  ['gaps', 'Lücken'],
  ['repeats', 'Wiederholungen'],
  ['known', 'Bekannt'],
];

/** A catalog link as the side bar shows it: a URL opens in a new tab, `case:<nr>` is a case, the rest is text. */
function linkKind(link) {
  const s = String(link);
  if (/^https?:\/\/[^\s]+$/i.test(s)) return { kind: 'url', text: s, href: s };
  const c = s.match(/^case:(.+)$/i);
  if (c) return { kind: 'case', text: c[1] };
  return { kind: 'ref', text: s };
}

// casedesk.html: the reading copy of a case's logs in the browser. A menu bar on top (File / View / Filter / Catalog /
// Settings), the reading copy in the middle, a side bar on the right with the errors, warnings, exceptions, gaps,
// repeats and known messages of the log, each a jump. The keys are those of the reading copy in Neovim.
//
// Every log is parsed, folded, filtered and unfolded by the Lua core of casedesk.nvim in a worker (src/casedesk_web.lua
// is its door); this file only shows what it answers. Nothing of a case goes into the browser's storage: IndexedDB
// `casedesk-web` keeps the handles of the folders used and of the catalog file, localStorage the settings of the view.
//
// build/pack.mjs puts `const PAGE = {...}`, appkit-web's folder.js and folder-input.js, src/client.js and
// src/app/util.js in front of this script.
/* global PAGE */

const SETTINGS_KEY = 'casedesk-web.view';
const CATALOG_KEY = 'catalog';
const DEFAULT_SETTINGS = {
  time: 'original',
  repeats: true,
  mode: 'labelled',
  delta_ms: 250,
  gap_minutes: 5,
  sidebar: true,
  sidebarWidth: 340,
};
const TIME_MODES = [
  ['original', 'Original'],
  ['utc', 'UTC'],
  ['relative', 'Relativ'],
];
const PS_MODES = ['labelled', 'all', 'clickable'];
const FILTER_FIELDS = [
  ['text', 'Text'],
  ['level', 'Level'],
  ['source', 'Quelle'],
  ['corr', 'Korrelations-ID'],
  ['dir', 'Richtung (request/response)'],
];
const QUICK_FILTERS = [
  ['Nur Fehler (error, fatal)', { field: 'level', raw: '/^[ef][ra][rt]/' }],
  ['Fehler und Warnungen', { field: 'level', raw: '/^[efw][ra][rta]/' }],
];
const MAX_OPEN_ALL = 2000;

// ── state ────────────────────────────────────────────────────────────────────────────────────────────────────────

const st = {
  engine: null,
  kv: null,
  recent: null,
  settings: loadSettings(),
  folder: null, // { handle, name, caseName, logs: [{ path, handle }], dir }
  open: null, // { paths, summary, files: [{ path, handle }] }
  filters: [],
  catalog: null, // { handle, name, text?, permission }
  rows: [], // top-level nodes of the view
  flat: [], // visible nodes in order
  byId: new Map(),
  cursor: 0,
  groups: null,
  status: null,
  message: '',
  busy: 0,
};

function loadSettings() {
  try {
    const raw = JSON.parse(localStorage.getItem(SETTINGS_KEY) ?? '{}');
    const s = { ...DEFAULT_SETTINGS };
    for (const k of Object.keys(DEFAULT_SETTINGS)) if (typeof raw[k] === typeof DEFAULT_SETTINGS[k]) s[k] = raw[k];
    if (!TIME_MODES.some(([m]) => m === s.time)) s.time = DEFAULT_SETTINGS.time;
    if (!PS_MODES.includes(s.mode)) s.mode = DEFAULT_SETTINGS.mode;
    return s;
  } catch {
    return { ...DEFAULT_SETTINGS };
  }
}

function saveSettings() {
  try {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(st.settings));
  } catch {
    // a browser without storage keeps the settings for this visit only
  }
}

// ── DOM helpers ──────────────────────────────────────────────────────────────────────────────────────────────────

function h(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else if (k === 'dataset') Object.assign(node.dataset, v);
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) node.append(c);
  return node;
}

const $ = (id) => document.getElementById(id);
const errText = (e) => (e && e.name ? `${e.name}: ${e.message}` : String(e));

function say(text) {
  st.message = text;
  renderStatus();
}

/** Run `fn` with the busy marker on; an error becomes the status message. */
async function busy(fn) {
  st.busy++;
  document.body.dataset.busy = 'true';
  try {
    return await fn();
  } catch (e) {
    say('Fehler: ' + errText(e));
    console.warn(e);
    return undefined;
  } finally {
    st.busy--;
    if (st.busy === 0) delete document.body.dataset.busy;
  }
}

/** One call of the door; an error answer throws. */
async function door(method, params, blobs) {
  if (!st.engine) throw new Error('der Lua-Kern ist noch nicht gestartet');
  const r = await st.engine.call(method, params, blobs);
  const doc = JSON.parse(r.text);
  if (r.code) throw new Error(`${r.code}: ${doc.message}`);
  return doc;
}

const list = (x) => (Array.isArray(x) ? x : []);

// ── layout ───────────────────────────────────────────────────────────────────────────────────────────────────────

function layout() {
  const app = $('app');
  app.replaceChildren(
    h(
      'header',
      { class: 'menubar', role: 'menubar', id: 'menubar' },
      menu('file', 'Datei', fileMenu),
      menu('view', 'Ansicht', viewMenu),
      menu('filter', 'Filter', filterMenu),
      menu('catalog', 'Katalog', catalogMenu),
      menu('settings', 'Einstellungen', settingsMenu),
      h('span', { class: 'where', id: 'where' }),
    ),
    h(
      'main',
      { class: 'workspace', id: 'workspace' },
      h('section', { id: 'log', class: 'log', tabindex: '0', role: 'tree', 'aria-label': 'Lesekopie' }),
      h('div', { id: 'splitter', class: 'splitter', role: 'separator', 'aria-orientation': 'vertical' }),
      h('aside', { id: 'sidebar', class: 'sidebar', 'aria-label': 'Treffer' }),
    ),
    h('footer', { id: 'status', class: 'status' }),
    h('dialog', { id: 'dialog', class: 'dialog' }),
  );
  applySidebar();
  splitter();
  document.addEventListener('keydown', onKey);
  document.addEventListener('click', (ev) => {
    if (!ev.target.closest('.menu')) closeMenus();
  });
}

function applySidebar() {
  const side = $('sidebar');
  side.hidden = !st.settings.sidebar;
  $('splitter').hidden = !st.settings.sidebar;
  side.style.width = st.settings.sidebarWidth + 'px';
}

function splitter() {
  const bar = $('splitter');
  bar.addEventListener('pointerdown', (ev) => {
    ev.preventDefault();
    bar.setPointerCapture(ev.pointerId);
    const move = (e) => {
      const w = Math.max(200, Math.min(window.innerWidth - 300, window.innerWidth - e.clientX));
      st.settings.sidebarWidth = Math.round(w);
      $('sidebar').style.width = w + 'px';
    };
    const up = () => {
      bar.removeEventListener('pointermove', move);
      bar.removeEventListener('pointerup', up);
      saveSettings();
    };
    bar.addEventListener('pointermove', move);
    bar.addEventListener('pointerup', up);
  });
}

// ── menus ────────────────────────────────────────────────────────────────────────────────────────────────────────

function menu(id, title, build) {
  const panel = h('div', { class: 'menu-panel', role: 'menu', id: `menu-${id}`, hidden: true });
  const button = h(
    'button',
    {
      type: 'button',
      class: 'menu-button',
      id: `menubutton-${id}`,
      'aria-haspopup': 'true',
      'aria-expanded': 'false',
      onclick: (ev) => {
        ev.stopPropagation();
        const isOpen = !panel.hidden;
        closeMenus();
        if (!isOpen) openMenu(id, build);
      },
      onmouseenter: () => {
        if (document.querySelector('.menu-panel:not([hidden])') && panel.hidden) {
          closeMenus();
          openMenu(id, build);
        }
      },
    },
    title,
  );
  return h('div', { class: 'menu', 'data-menu': id }, button, panel);
}

function openMenu(id, build) {
  const panel = $(`menu-${id}`);
  panel.replaceChildren(...build());
  panel.hidden = false;
  $(`menubutton-${id}`).setAttribute('aria-expanded', 'true');
  panel.querySelector('button:not([disabled])')?.focus();
}

function closeMenus() {
  for (const p of document.querySelectorAll('.menu-panel')) p.hidden = true;
  for (const b of document.querySelectorAll('.menu-button')) b.setAttribute('aria-expanded', 'false');
}

/** A menu item: a label, the key beside it, what it does; `check` shows a mark (a radio or a check box). */
function item(label, run, opts = {}) {
  return h(
    'button',
    {
      type: 'button',
      class: 'menu-item' + (opts.check !== undefined ? ' checkable' : ''),
      role: opts.check !== undefined ? 'menuitemcheckbox' : 'menuitem',
      'aria-checked': opts.check !== undefined ? String(Boolean(opts.check)) : undefined,
      disabled: opts.disabled,
      title: opts.title,
      onclick: (ev) => {
        ev.stopPropagation();
        closeMenus();
        run();
      },
    },
    h('span', { class: 'mark' }, opts.check ? '✓' : ''),
    h('span', { class: 'label' }, label),
    h('span', { class: 'key' }, opts.key ?? ''),
  );
}

const sep = () => h('div', { class: 'menu-sep', role: 'separator' });
const note = (text) => h('div', { class: 'menu-note' }, text);

// ── folders and logs ─────────────────────────────────────────────────────────────────────────────────────────────

async function refreshRecent() {
  try {
    st.recentList = await st.recent.list();
  } catch {
    st.recentList = [];
  }
}

async function chooseFolder() {
  let handle;
  if (pickerSupport(window) === 'ok') {
    const r = await pickFolder(window, { id: 'casedesk-web', mode: 'read' });
    if (r.kind === 'cancelled') return;
    if (r.kind !== 'picked') return say(`Ordner nicht gewählt: ${r.message}`);
    handle = r.handle;
    await busy(async () => {
      await st.recent.remember(handle, Date.now());
      await refreshRecent();
    });
  } else {
    const r = await pickFolderByInput(document);
    if (r.kind === 'cancelled') return;
    if (r.kind !== 'picked') return say(`Ordner nicht gewählt (${r.kind})`);
    handle = r.folder;
  }
  await useFolder(handle);
}

async function openRecent(r) {
  const p = await grantAccess(r.handle, 'read');
  if (p === 'gone') return say(`${r.name}: der Ordner ist nicht mehr da`);
  if (p !== 'granted') return say(`${r.name}: kein Zugriff erlaubt`);
  await busy(async () => {
    await st.recent.remember(r.handle, Date.now());
    await refreshRecent();
  });
  await useFolder(r.handle);
}

async function forgetRecent() {
  await busy(async () => {
    for (const r of st.recentList ?? []) await st.recent.forget(r.id);
    await refreshRecent();
  });
  if (!st.folder) renderStart();
  say('Die Liste der zuletzt benutzten Ordner ist leer.');
}

/** The case number of a folder: `case` of its `.case.json`, else the folder's name. */
async function caseName(handle) {
  try {
    const f = await childFile(handle, '.case.json');
    if (f) {
      const meta = JSON.parse(new TextDecoder().decode(await (await f.getFile()).arrayBuffer()));
      if (typeof meta.case === 'string' || typeof meta.case === 'number') return String(meta.case);
    }
  } catch {
    // an unreadable sidecar names nothing
  }
  return displayName(handle.name);
}

async function useFolder(handle) {
  await busy(async () => {
    const assets = await childFolder(handle, ASSETS);
    const dir = assets ?? handle;
    const logs = await listLogs(dir);
    st.folder = { handle, name: displayName(handle.name), caseName: await caseName(handle), logs, assets: Boolean(assets) };
    closeLog(true);
    renderWhere();
    showLogPicker();
  });
}

function showLogPicker() {
  const f = st.folder;

    'button',

      type: 'button',

    try {
      const file = await l.handle.getFile();
      const cell = log.querySelector(`td.size[data-index="${i}"]`);
      if (cell) cell.textContent = formatSize(file.size);
    } catch {
      // a file that went away shows no size; opening it says why
    }
  });
}

/** Ask again for the catalog file when its permission lapsed (inside the click that opens a log). */
async function catalogText() {
  const c = st.catalog;
  if (!c) return null;
  if (c.handle.queryPermission) {
    let p = await c.handle.queryPermission({ mode: 'read' }).catch(() => 'denied');
    if (p !== 'granted' && c.handle.requestPermission) p = await c.handle.requestPermission({ mode: 'read' }).catch(() => 'denied');
    c.permission = p;
    if (p !== 'granted') {
      say(`Katalog ${c.name}: kein Zugriff, das Log wird ohne Katalog gezeigt`);
      return null;
    }
  }
  try {
    return decodeLog(new Uint8Array(await (await c.handle.getFile()).arrayBuffer())).text;
  } catch (e) {
    say(`Katalog ${c.name} nicht lesbar: ${errText(e)}`);
    return null;
  }
}

async function openLogs(chosen) {
  // the catalog's permission first: a request needs the click that is still running
  const catalog = await catalogText();
  await busy(async () => {
    const texts = [];
    for (const l of chosen) {
      const file = await l.handle.getFile();
      if (file.size > MAX_LOG_BYTES) throw new Error(`${l.path}: größer als ${formatSize(MAX_LOG_BYTES)}`);
      texts.push(decodeLog(new Uint8Array(await file.arrayBuffer())).text);
    }
    const params = { logs: chosen.map((l, i) => ({ name: l.path.split('/').at(-1), blob: i + 1 })) };
    const blobs = [...texts];
    if (catalog !== null) {
      blobs.push(catalog);
      params.catalog = { blob: blobs.length };
    }
    const t0 = performance.now();
    const summary = await door('open', params, blobs);
    if (summary.merged && st.settings.time === 'original') st.settings.time = 'utc';
    st.open = { paths: chosen.map((l) => l.path), files: chosen, summary };
    st.filters = [];
    await refreshView({ keep: false });
    renderWhere();
    say(`${chosen.map((l) => l.path).join(' + ')}: ${summary.entries} Einträge in ${Math.round(performance.now() - t0)} ms`);
    $('log').focus();
  });
}

async function reload() {
  if (st.open) await openLogs(st.open.files);
}

function closeLog(quiet) {
  if (st.open && st.engine) door('close').catch(() => {});
  st.open = null;
  st.rows = [];
  st.flat = [];
  st.byId = new Map();
  st.groups = null;
  st.status = null;
  st.filters = [];
  renderWhere();
  renderStatus();
  if (!quiet) showLogPicker();
}

// ── catalog ──────────────────────────────────────────────────────────────────────────────────────────────────────

async function loadCatalogHandle() {
  try {
    const stored = await st.kv.get(CATALOG_KEY);
    const handle = stored?.handle;
    if (handle && handle.kind === 'file' && typeof handle.getFile === 'function') {
      const permission = handle.queryPermission ? await handle.queryPermission({ mode: 'read' }).catch(() => 'denied') : 'granted';
      st.catalog = { handle, name: displayName(handle.name), permission };
    }
  } catch {
    // no catalog kept
  }
}

async function chooseCatalog() {
  let handle;
  if (typeof window.showOpenFilePicker === 'function') {
    try {
      [handle] = await window.showOpenFilePicker({ id: 'casedesk-web-catalog', multiple: false });
    } catch (e) {
      if (e?.name === 'AbortError') return;
      return say(`Katalog nicht gewählt: ${errText(e)}`);
    }
    await busy(() => st.kv.put(CATALOG_KEY, { handle }));
  } else {
    handle = await new Promise((resolve) => {
      const input = h('input', { type: 'file', hidden: true });
      input.addEventListener('change', () => resolve(input.files?.[0] ? { kind: 'file', name: input.files[0].name, getFile: async () => input.files[0] } : null), { once: true });
      input.addEventListener('cancel', () => resolve(null), { once: true });
      document.body.append(input);
      input.click();
    });
    if (!handle) return;
  }
  st.catalog = { handle, name: displayName(handle.name), permission: 'granted' };
  if (st.open) await openLogs(st.open.files);
  else say(`Katalog ${st.catalog.name} gewählt`);
}

async function forgetCatalog() {
  st.catalog = null;
  await busy(() => st.kv.put(CATALOG_KEY, null));
  if (st.open) await openLogs(st.open.files);
  else say('Kein Katalog mehr');
}

function showProblems(problems) {
  dialog('Probleme im Katalog', h('ul', { class: 'problems' }, problems.map((p) => h('li', {}, p))));
}

// ── the view ─────────────────────────────────────────────────────────────────────────────────────────────────────

/** What is open and where the cursor is, to restore after a new view. */
function snapshot() {
  const open = [];
  const walk = (nodes) => {
    for (const n of nodes) {
      if (n.open) {
        open.push(n.id);
        walk(n.children ?? []);
      }
    }
  };
  walk(st.rows);
  return { open, cursor: st.flat[st.cursor]?.id };
}

async function refreshView({ keep = true } = {}) {
  if (!st.open) return;
  const snap = keep ? snapshot() : { open: [], cursor: null };
  const s = st.settings;
  const v = await door('view', {
    time: s.time,
    repeats: s.repeats,
    filters: st.filters,
    delta_ms: s.delta_ms,
    gap_minutes: s.gap_minutes,
  });
  st.byId = new Map();
  st.rows = list(v.rows).map((r) => node(r, 0, null));
  st.groups = v.groups;
  st.status = v.status;
  st.flat = [...st.rows];
  // unfold again what was open, level by level
  let todo = snap.open.filter((id) => st.byId.has(id));
  const done = new Set();
  while (todo.length) {
    const nodes = todo.map((id) => st.byId.get(id)).filter((n) => n && n.expandable);
    if (!nodes.length) break;
    await loadChildren(nodes);
    for (const n of nodes) {
      n.open = true;
      done.add(n.id);
    }
    todo = snap.open.filter((id) => !done.has(id) && st.byId.has(id));
  }
  st.flat = flatten(st.rows);
  const at = snap.cursor ? st.flat.findIndex((n) => n.id === snap.cursor) : -1;
  st.cursor = at >= 0 ? at : 0;
  renderLog();
  renderSidebar();
  renderStatus();
}

function node(r, depth, parent) {
  const n = { ...r, depth, parent, open: false, children: null };
  st.byId.set(n.id, n);
  return n;
}

function flatten(nodes, out = []) {
  for (const n of nodes) {
    out.push(n);
    if (n.open && n.children) flatten(n.children, out);
  }
  return out;
}

/** Load the children of `nodes` that have none yet, in one call. */
async function loadChildren(nodes, force = false) {
  const need = nodes.filter((n) => n.expandable && (force || !n.children));
  if (!need.length) return;
  const r = await door('children', { ids: need.map((n) => n.id), mode: st.settings.mode });
  const byId = new Map(need.map((n) => [n.id, n]));
  for (const { id, children } of list(r.nodes)) {
    const n = byId.get(id);
    if (n) n.children = list(children).map((c) => node({ ...c, type: 'body' }, n.depth + 1, n));
  }
}

// ── rendering ────────────────────────────────────────────────────────────────────────────────────────────────────

function renderWhere() {
  const parts = [];
  if (st.folder) parts.push(st.folder.caseName);
  if (st.open) parts.push(st.open.paths.map((p) => p.split('/').at(-1)).join(' + '));
  $('where').textContent = parts.join(' · ');
  document.title = parts.length ? `${parts.join(' · ')} — casedesk` : 'casedesk';
}

function renderStart() {
  const recent = st.recentList ?? [];
  $('log').replaceChildren(
    h(
      'div',
      { class: 'start' },
      h('h1', {}, 'casedesk — Lesekopie von Fall-Logs'),
      h(
        'p',
        { class: 'hint' },
        'Fallordner wählen, dann ein Log aus assets/. Die Seite liest nur den gewählten Ordner, schickt nichts ins Netz ' +
          'und speichert keine Inhalte im Browser (nur den Ordner-Verweis und Ansichtseinstellungen).',
      ),
      h('button', { type: 'button', id: 'pick', class: 'primary', onclick: () => chooseFolder() }, 'Fallordner wählen …'),
      recent.length
        ? h(
            'div',
            { class: 'recent' },
            h('h2', {}, 'Zuletzt benutzt'),
            h('ul', {}, recent.map((r) => h('li', {}, h('button', { type: 'button', class: 'link', onclick: () => openRecent(r) }, r.name)))),
          )
        : null,
      h('p', { class: 'hint small' }, `Build ${PAGE.build} · ${PAGE.engine}`),
    ),
  );
  renderSidebar();
  renderStatus();
}

function lnumWidth() {
  let max = 1;
  for (const r of st.rows) if (r.src > max) max = r.src;
  return String(max).length;
}

function rowEl(n, width) {
  const mark = n.expandable ? (n.open ? '▾' : '▸') : ' ';
  const attrs = { class: 'row', role: 'treeitem', dataset: { id: n.id }, 'aria-level': String(n.depth + 1) };
  if (n.expandable) attrs['aria-expanded'] = String(n.open);
  if (n.type === 'gap') {
    attrs.class += ' gap';
    return h('div', attrs, h('span', { class: 'lnum' }, ' '.repeat(width)), ' ', h('span', { class: 'gapline' }, n.label));
  }
  if (n.type === 'entry') {
    attrs.class += ' entry' + (n.class ? ` lvl-${n.class}` : '');
    const known = list(n.known);
    const items = st.open?.summary.catalog ? list(st.open.summary.catalog.items) : [];
    const first = known.length ? items.find((x) => x.index === known[0]) : null;
    return h(
      'div',
      attrs,
      h('span', { class: 'lnum' }, String(n.src).padStart(width)),
      ' ',
      h('span', { class: 'mark', onclick: (ev) => (ev.stopPropagation(), toggle(n)) }, mark),
      ' ',
      h('span', { class: 'time' }, n.time ?? ''),
      '  ',
      h('span', { class: 'kind' }, n.kind ?? ''),
      '  ',
      n.tag ? h('span', { class: 'tag' }, n.tag + '  ') : null,
      n.rep ? h('span', { class: 'rep' }, n.rep + '  ') : null,
      n.source ? h('span', { class: 'source' }, n.source + '  ') : null,
      h('span', { class: 'text' }, n.text),
      n.note ? h('span', { class: 'note' }, '  ⚠ ' + n.note) : null,
      n.delta ? h('span', { class: 'delta' }, '  ' + n.delta) : null,
      first ? h('span', { class: 'known', title: first.explain }, `  ⚑ known: ${first.title}${known.length > 1 ? ` +${known.length - 1}` : ''}`) : null,
    );
  }
  attrs.class += ' body';
  const label = h('span', { class: 'label' + (n.hl ? ' hl-' + n.hl : '') });
  for (const p of pieces(n.label, n.spans)) label.append(p.group ? h('span', { class: 'hl-' + p.group }, p.text) : p.text);
  return h(
    'div',
    attrs,
    h('span', { class: 'lnum' }, ' '.repeat(width)),
    ' '.repeat(1 + 2 * (n.depth - 1)) + ' ',
    h('span', { class: 'mark', onclick: (ev) => (ev.stopPropagation(), toggle(n)) }, mark),
    ' ',
    label,
  );
}

function renderLog() {
  const log = $('log');
  if (!st.open) return showLogPicker();
  const width = lnumWidth();
  const s = st.open.summary;
  const head = h(
    'div',
    { class: 'loghead' },
    h('span', { class: 'format' }, s.known || s.merged ? s.format.label : 'unknown format'),
    s.confidence && !s.merged ? h('span', { class: 'dim' }, ` (${s.confidence})`) : null,
    h('span', { class: 'dim' }, ` · ${s.lines} Zeilen · ${s.entries} ${s.report ? 'Abschnitte' : 'Einträge'}`),
    s.header ? h('span', { class: 'dim' }, ` · ${s.header}`) : null,
  );
  const rows = h('div', { class: 'rows', id: 'rows' });
  for (const n of st.flat) {
    n.el = rowEl(n, width);
    rows.append(n.el);
  }
  log.replaceChildren(head, rows);
  if (!st.flat.length) rows.append(h('div', { class: 'empty' }, 'Kein Eintrag (Filter?)'));
  rows.onclick = (ev) => {
    const el = ev.target.closest('.row');
    if (!el) return;
    const i = st.flat.findIndex((n) => n.id === el.dataset.id);
    if (i >= 0) setCursor(i);
  };
  rows.ondblclick = (ev) => {
    const el = ev.target.closest('.row');
    const n = el && st.byId.get(el.dataset.id);
    if (n) toggle(n);
  };
  setCursor(Math.min(st.cursor, Math.max(0, st.flat.length - 1)), false);
}

function setCursor(i, scroll = true) {
  if (!st.flat.length) return;
  i = Math.max(0, Math.min(st.flat.length - 1, i));
  st.flat[st.cursor]?.el?.classList.remove('cursor');
  st.cursor = i;
  const el = st.flat[i].el;
  if (el) {
    el.classList.add('cursor');
    if (scroll) el.scrollIntoView({ block: 'nearest' });
  }
}

/** Re-draw one node's row and its open subtree in place. */
function redraw(n) {
  const width = lnumWidth();
  const at = st.flat.indexOf(n);
  if (at < 0) return;
  // the rows below n that belong to it
  let end = at + 1;
  while (end < st.flat.length && isBelow(st.flat[end], n)) end++;
  for (let k = at + 1; k < end; k++) st.flat[k].el?.remove();
  const fresh = flatten([n]);
  const old = n.el;
  for (const m of fresh) m.el = rowEl(m, width);
  old.replaceWith(...fresh.map((m) => m.el));
  st.flat.splice(at, end - at, ...fresh);
  // the cursor stays on its row: below the subtree it moves by what the subtree grew, inside a folded one it goes to n
  const cur = st.cursor;
  if (cur >= end) st.cursor = cur + fresh.length - (end - at);
  else if (cur > at && cur >= at + fresh.length) st.cursor = at;
  for (const el of document.querySelectorAll('#rows .row.cursor')) el.classList.remove('cursor');
  st.flat[st.cursor]?.el?.classList.add('cursor');
}

function isBelow(m, n) {
  for (let p = m.parent; p; p = p.parent) if (p === n) return true;
  return false;
}

async function toggle(n, want) {
  if (!n?.expandable) return;
  const open = want ?? !n.open;
  if (open === n.open) return;
  if (open) {
    await busy(() => loadChildren([n]));
    // a failed load leaves the row folded (the status line says why)
    if (!n.children) return;
  }
  n.open = open;
  redraw(n);
}

/** The entry row a row belongs to (itself for an entry). */
function entryOf(n) {
  let e = n;
  while (e?.parent) e = e.parent;
  return e;
}

async function openAll() {
  if (!st.open) return;
  const nodes = st.rows.filter((n) => n.expandable);
  if (nodes.length > MAX_OPEN_ALL) return say(`Mehr als ${MAX_OPEN_ALL} Einträge: erst filtern, dann aufklappen`);
  await busy(async () => {
    await loadChildren(nodes);
    for (const n of nodes) n.open = true;
    const cur = st.flat[st.cursor];
    st.flat = flatten(st.rows);
    st.cursor = Math.max(0, st.flat.indexOf(cur));
    renderLog();
  });
}

function closeAll() {
  if (!st.open) return;
  const walk = (nodes) => {
    for (const n of nodes) {
      n.open = false;
      if (n.children) walk(n.children);
    }
  };
  const cur = entryOf(st.flat[st.cursor]);
  walk(st.rows);
  st.flat = flatten(st.rows);
  st.cursor = Math.max(0, st.flat.indexOf(cur));
  renderLog();
}

function renderSidebar() {
  const side = $('sidebar');
  if (!side) return;
  if (!st.open || !st.groups) {
    side.replaceChildren(h('div', { class: 'side-empty' }, h('h2', {}, 'Treffer'), h('p', { class: 'hint' }, 'Ein Log öffnen, dann stehen hier Fehler, Warnungen, Exceptions, Lücken, Wiederholungen und bekannte Meldungen.')));
    return;
  }
  const out = [h('h2', {}, 'Treffer')];
  for (const [key, title] of GROUPS) {
    const entries = list(st.groups[key]);
    if (key === 'known' && !st.open.summary.catalog) {
      out.push(h('details', { class: 'group', dataset: { group: key } }, h('summary', {}, `${title} (kein Katalog)`), h('p', { class: 'hint' }, 'Katalog → Katalog-Datei wählen …')));
      continue;
    }
    const count = key === 'known' ? entries.reduce((n, g) => n + list(g.rows).length, 0) : entries.length;
    const details = h('details', { class: 'group', dataset: { group: key }, open: count > 0 && key !== 'repeats' ? true : undefined }, h('summary', {}, `${title} (${count})`));
    if (key === 'known') {
      for (const g of entries) details.append(knownBlock(g));
    } else {
      const ul = h('ul', {});
      for (const r of entries) ul.append(h('li', {}, jumpButton(r.id, r.time ? `${r.time}  ${r.text ?? r.label}` : (r.text ?? r.label))));
      details.append(ul);
    }
    out.push(details);
  }
  side.replaceChildren(...out);
}

function jumpButton(id, label) {
  return h('button', { type: 'button', class: 'jump', title: label, onclick: () => jumpTo(id) }, label);
}

function knownBlock(g) {
  const links = list(g.links).map((l) => {
    const k = linkKind(l);
    if (k.kind === 'url') return h('a', { href: k.href, target: '_blank', rel: 'noopener noreferrer' }, k.text);
    return h('span', { class: k.kind }, k.kind === 'case' ? `Fall ${k.text}` : k.text);
  });
  const block = h(
    'div',
    { class: `known-item sev-${g.severity}`, dataset: { known: g.id } },
    h('div', { class: 'known-title' }, `✱ ${g.title}`, h('span', { class: 'dim' }, ` · ${g.severity}`)),
    g.explain ? h('div', { class: 'explain' }, g.explain) : null,
    links.length ? h('div', { class: 'links' }, ...links.flatMap((a, i) => (i ? [' · ', a] : [a]))) : null,
  );
  const ul = h('ul', {});
  for (const r of list(g.rows)) ul.append(h('li', {}, jumpButton(r.id, `${r.time}  ${r.text}`)));
  block.append(ul);
  return block;
}

function renderStatus() {
  const bar = $('status');
  if (!bar) return;
  const parts = [];
  const s = st.status;
  if (st.open && s) {
    parts.push(st.open.summary.format.label);
    parts.push(`${s.shown}/${s.total} Einträge`);
    if (s.filter) parts.push(`Filter: ${s.filter}`);
    const t = TIME_MODES.find(([m]) => m === s.time)?.[1] ?? s.time;
    parts.push(`Zeit: ${t}${s.unzoned ? ` (${s.unzoned} ohne Zone, wie geschrieben)` : ''}`);
    parts.push(`Seitenquelltext: ${st.settings.mode}`);
    if (!st.settings.repeats) parts.push('ungefaltet');
  }
  bar.replaceChildren(h('span', { class: 'facts' }, parts.join(' · ')), h('span', { class: 'message', id: 'message' }, st.message));
}

// ── actions ──────────────────────────────────────────────────────────────────────────────────────────────────────

async function setTime(m) {
  st.settings.time = m;
  saveSettings();
  await busy(() => refreshView());
}

async function toggleRepeats() {
  st.settings.repeats = !st.settings.repeats;
  saveSettings();
  await busy(() => refreshView());
}

/** A new page source mode: every page source node loaded so far gets its rows again, the folded ones too. */
async function setMode(m) {
  st.settings.mode = m;
  saveSettings();
  if (!st.open) return renderStatus();
  await busy(async () => {
    const loaded = [...st.byId.values()].filter((n) => n.pagesource && n.children);
    if (loaded.length) {
      // drop what hangs below them, then load in the new mode
      for (const n of loaded) {
        for (const c of n.children) forget(c);
      }
      await loadChildren(loaded, true);
      for (const n of loaded) if (n.open && n.el?.isConnected) redraw(n);
    } else {
      await door('children', { ids: [], mode: m });
    }
    renderStatus();
  });
  say(`Seitenquelltext: ${m}`);
}

function forget(n) {
  st.byId.delete(n.id);
  for (const c of n.children ?? []) forget(c);
}

async function addFilter(clause) {
  const before = st.filters;
  st.filters = [...before, clause];
  const shown = await busy(async () => {
    await refreshView();
    return true;
  });
  // a filter the core refuses would make every later view fail: it goes again (the status line says why)
  if (!shown) st.filters = before;
}

async function popFilter() {
  if (!st.filters.length) return say('Kein Filter zum Zurücknehmen');
  st.filters = st.filters.slice(0, -1);
  await busy(() => refreshView());
}

async function clearFilters() {
  if (!st.filters.length) return say('Kein Filter aktiv');
  st.filters = [];
  await busy(() => refreshView());
}

function toggleSidebar() {
  st.settings.sidebar = !st.settings.sidebar;
  saveSettings();
  applySidebar();
}

/** Move to the row `id` (a side bar jump): its entry is a top-level row, always shown. */
function jumpTo(id) {
  const i = st.flat.findIndex((n) => n.id === id);
  if (i < 0) return say('Der Eintrag ist nicht zu sehen (Filter?)');
  setCursor(i, false);
  st.flat[i].el?.scrollIntoView({ block: 'center' });
  $('log').focus({ preventScroll: true });
}

const JUMPS = {
  next_error: [1, (n) => n.class === 'error' || n.class === 'fatal', 'Kein weiterer Fehler'],
  prev_error: [-1, (n) => n.class === 'error' || n.class === 'fatal', 'Kein früherer Fehler'],
  next_warn: [1, (n) => n.class === 'warn', 'Keine weitere Warnung'],
  prev_warn: [-1, (n) => n.class === 'warn', 'Keine frühere Warnung'],
  next_request: [1, (n) => n.request === true, 'Kein weiterer Request'],
  prev_request: [-1, (n) => n.request === true, 'Kein früherer Request'],
  next_known: [1, (n) => list(n.known).length > 0, 'Keine weitere bekannte Meldung'],
  prev_known: [-1, (n) => list(n.known).length > 0, 'Keine frühere bekannte Meldung'],
  next_gap: [1, (n) => n.type === 'gap', 'Keine weitere Lücke'],
  prev_gap: [-1, (n) => n.type === 'gap', 'Keine frühere Lücke'],
};

function jump(action) {
  if (!st.open) return;
  const [step, test, none] = JUMPS[action];
  for (let i = st.cursor + step; i >= 0 && i < st.flat.length; i += step) {
    const n = st.flat[i];
    if (n.depth === 0 && test(n)) {
      setCursor(i);
      if (action.endsWith('_known')) explainKnown(n);
      else say('');
      return;
    }
  }
  say(action.endsWith('_known') && !st.open.summary.catalog ? 'Kein Katalog gewählt (Katalog → Katalog-Datei wählen …)' : none);
}

function explainKnown(n) {
  const items = list(st.open?.summary.catalog?.items);
  const texts = list(n.known).map((k) => items.find((x) => x.index === k)).filter(Boolean);
  say(texts.map((x) => `known: ${x.title} [${x.severity}]`).join(' · '));
}

async function showOriginal() {
  const n = st.flat[st.cursor];
  if (!n || !st.open) return;
  const e = entryOf(n);
  const from = n.type === 'body' && typeof n.src === 'number' ? n.src : e.src;
  const to = n.type === 'body' ? from : (e.src_end ?? e.src);
  const r = await busy(() => door('original', { from, to, file: typeof e.file === 'number' ? e.file : 1 }));
  if (!r) return;
  const width = String(r.to).length;
  const text = list(r.lines).map((l, k) => `${String(r.from + k).padStart(width)}  ${l}`).join('\n');
  dialog(`${r.name}, Zeilen ${r.from}–${r.to}${r.to - r.from + 1 < to - from + 1 ? ` (von ${to - from + 1})` : ''}`, h('pre', { class: 'original' }, text));
}

function showHelp() {
  const names = {
    toggle: 'Eintrag/Knoten auf- oder zuklappen',
    open: 'aufklappen',
    close: 'zuklappen',
    close_all: 'alles zuklappen',
    open_all: 'jeden Eintrag eine Stufe aufklappen',
    original: 'Original-Zeilen des Eintrags zeigen',
    next_error: 'nächster Fehler',
    prev_error: 'voriger Fehler',
    next_warn: 'nächste Warnung',
    prev_warn: 'vorige Warnung',
    next_request: 'nächster Request',
    prev_request: 'voriger Request',
    next_known: 'nächste bekannte Meldung (Katalog)',
    prev_known: 'vorige bekannte Meldung',
    next_gap: 'nächste Lücke',
    prev_gap: 'vorige Lücke',
    filter: 'Filter hinzufügen',
    filter_pop: 'letzten Filter zurücknehmen',
    filter_clear: 'alle Filter weg',
    tz: 'Zeit: Original → UTC → relativ',
    repeats: 'Wiederholungen falten ↔ alle Einträge',
    mode: 'Seitenquelltext: labelled → all → clickable',
    help: 'diese Tasten',
    down: 'eine Zeile runter',
    up: 'eine Zeile hoch',
    first: 'erste Zeile',
    last: 'letzte Zeile',
    page_down: 'eine Seite runter',
    page_up: 'eine Seite hoch',
  };
  dialog(
    'Tasten (wie in Neovim)',
    h('table', { class: 'keys' }, Object.entries(KEYS).map(([a, seqs]) => h('tr', {}, h('td', {}, h('kbd', {}, seqs.join(' '))), h('td', {}, names[a] ?? a)))),
  );
}

function showFilterDialog() {
  if (!st.open) return;
  const field = h('select', { id: 'filter-field' }, FILTER_FIELDS.map(([v, l]) => h('option', { value: v }, l)));
  const input = h('input', { id: 'filter-raw', type: 'text', size: '40', autocomplete: 'off', spellcheck: 'false' });
  const form = h(
    'form',
    {
      method: 'dialog',
      class: 'filter-form',
      onsubmit: (ev) => {
        ev.preventDefault();
        const raw = input.value.trim();
        $('dialog').close();
        if (raw && raw !== '!') addFilter({ field: field.value, raw });
      },
    },
    h('label', {}, 'Feld ', field),
    h('label', {}, 'Wert ', input),
    h('p', { class: 'hint' }, 'Teilstring (Groß/klein egal); /…/ = Lua-Muster; ! vorne schließt aus.'),
    h('div', { class: 'buttons' }, h('button', { type: 'submit', class: 'primary' }, 'Hinzufügen'), h('button', { type: 'button', onclick: () => $('dialog').close() }, 'Abbrechen')),
  );
  dialog('Filter hinzufügen', form);
  input.focus();
}

function showSettingsDialog() {
  const s = st.settings;
  const delta = h('input', { id: 'set-delta', type: 'number', min: '-1', step: '50', value: String(s.delta_ms) });
  const gap = h('input', { id: 'set-gap', type: 'number', min: '0', step: '1', value: String(s.gap_minutes) });
  const form = h(
    'form',
    {
      method: 'dialog',
      class: 'settings-form',
      onsubmit: async (ev) => {
        ev.preventDefault();
        const d = Number(delta.value);
        const g = Number(gap.value);
        $('dialog').close();
        if (Number.isFinite(d)) s.delta_ms = Math.round(d);
        if (Number.isFinite(g) && g >= 0) s.gap_minutes = g;
        saveSettings();
        await busy(() => refreshView());
      },
    },
    h('label', {}, 'Abstand am Zeilenende ab (ms, −1 = nie) ', delta),
    h('label', {}, 'Lücke als eigene Zeile ab (Minuten, 0 = nie) ', gap),
    h('div', { class: 'buttons' }, h('button', { type: 'submit', class: 'primary' }, 'Übernehmen'), h('button', { type: 'button', onclick: () => $('dialog').close() }, 'Abbrechen')),
  );
  dialog('Abstände und Lücken', form);
}

function dialog(title, body) {
  const d = $('dialog');
  d.replaceChildren(
    h('div', { class: 'dialog-head' }, h('h2', {}, title), h('button', { type: 'button', class: 'close', 'aria-label': 'Schließen', onclick: () => d.close() }, '×')),
    body,
  );
  d.showModal();
}

// ── keys ─────────────────────────────────────────────────────────────────────────────────────────────────────────

const keys = new KeyReader();
let keyTimer = null;

function onKey(ev) {
  if ($('dialog').open) return;
  if (ev.target.closest && ev.target.closest('input, select, textarea')) return;
  if (ev.key === 'Escape') {
    closeMenus();
    keys.reset();
    return;
  }
  // inside a menu the browser's own keys (Tab, Enter on a button) work
  if (ev.target.closest && ev.target.closest('.menu')) return;
  const name = keyName(ev);
  if (!name) return;
  const r = keys.feed(name);
  clearTimeout(keyTimer);
  if (r.kind === 'pending') {
    ev.preventDefault();
    keyTimer = setTimeout(() => keys.reset(), 1000);
    return;
  }
  if (r.kind !== 'action') return;
  // <CR> on a focused button is the button's
  if (name === '<CR>' && ev.target.closest && ev.target.closest('button, a')) return;
  ev.preventDefault();
  run(r.action);
}

function pageRows() {
  const row = st.flat[0]?.el;
  const h1 = row ? row.getBoundingClientRect().height || 18 : 18;
  return Math.max(1, Math.floor($('log').clientHeight / h1) - 2);
}

function run(action) {
  const n = st.flat[st.cursor];
  switch (action) {
    case 'toggle':
      return n && toggle(n);
    case 'open':
      return n && toggle(n, true);
    case 'close':
      if (!n) return;
      if (n.expandable && n.open) return toggle(n, false);
      if (n.parent) return toggle(entryOf(n), false).then(() => focusNode(entryOf(n)));
      return;
    case 'close_all':
      return closeAll();
    case 'open_all':
      return openAll();
    case 'original':
      return showOriginal();
    case 'filter':
      return showFilterDialog();
    case 'filter_pop':
      return popFilter();
    case 'filter_clear':
      return clearFilters();
    case 'tz': {
      const i = TIME_MODES.findIndex(([m]) => m === st.settings.time);
      const next = TIME_MODES[(i + 1) % TIME_MODES.length][0];
      return setTime(next).then(() => say(`Zeit: ${TIME_MODES.find(([m]) => m === next)[1]}`));
    }
    case 'repeats':
      return toggleRepeats().then(() => say(st.settings.repeats ? 'Wiederholungen gefaltet' : 'Alle Einträge'));
    case 'mode':
      return setMode(PS_MODES[(PS_MODES.indexOf(st.settings.mode) + 1) % PS_MODES.length]);
    case 'help':
      return showHelp();
    case 'down':
      return setCursor(st.cursor + 1);
    case 'up':
      return setCursor(st.cursor - 1);
    case 'first':
      return setCursor(0);
    case 'last':
      return setCursor(st.flat.length - 1);
    case 'page_down':
      return setCursor(st.cursor + pageRows());
    case 'page_up':
      return setCursor(st.cursor - pageRows());
    default:
      if (JUMPS[action]) return jump(action);
  }
}

function focusNode(n) {
  const i = st.flat.indexOf(n);
  if (i >= 0) setCursor(i);
}

// ── start ────────────────────────────────────────────────────────────────────────────────────────────────────────

async function main() {
  layout();
  document.body.dataset.state = 'starting';
  st.kv = idbKeyValue(indexedDB, 'casedesk-web');
  st.recent = new RecentFolders(st.kv);
  await refreshRecent();
  await loadCatalogHandle();
  renderStart();
  say('Lua-Kern startet …');
  try {
    const t0 = performance.now();
    st.engine = await startEngine();
    say(`Bereit (Lua-Kern in ${Math.round(performance.now() - t0)} ms gestartet)`);
    document.body.dataset.state = 'ready';
  } catch (e) {
    say('Der Lua-Kern startet nicht: ' + errText(e));
    document.body.dataset.state = 'fail';
  }
}

main();
</script>
