# Build and check the pages: the committed pages are the build of the sources, the tests in Node, the pages from disk in
# Chrome. The Lua sources come from casedesk.nvim and lib.nvim at the commits of engine.lock.
#
# Runs on the self-hosted Windows runner of the author, like the other apps (docmap-desktop, hub-desktop): the pages are
# used from disk in Chrome on Windows, and the runner clones the private engine repositories with the git login of the
# machine, so no token is kept here. Only `push` to main and manual runs: no `pull_request` trigger, so no code of a
# fork ever runs on that machine (keep it that way). `bash` is the WSL launcher there, so Git Bash is named explicitly,
# in 8.3 form because the shell string is split at spaces.
#
# Actions are pinned by commit (the tag in the comment).
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: [self-hosted, windows]
    timeout-minutes: 30
    defaults:
      run:
        shell: C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}
    env:
      CASEDESK_NVIM_DIR: ${{ github.workspace }}/engine/casedesk.nvim
      LIB_NVIM_DIR: ${{ github.workspace }}/engine/lib.nvim
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm comes from the runner's PATH (as in the other apps); Node is set to the version the tests expect
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      # Advisory: legacy patterns in the sources (rules-vault web); a finding does not fail the build
      - name: Legacy scan
        continue-on-error: true
        env:
          DISABLE_TELEMETRY: '1'
        run: pnpm exec modern-web-guidance legacy-scan src --json

      # engine.lock is read by the build's own reader, not by a second one here
      - name: Engine commits from engine.lock
        id: engine
        run: |
          node --input-type=module -e "
            import { appendFileSync } from 'node:fs';
            import { readLock } from './build/bundle.mjs';
            const lock = readLock();
            appendFileSync(process.env.GITHUB_OUTPUT, 'casedesk=' + lock.casedesk_commit + '\nlib=' + lock.lib_commit + '\n');
          "

      # The build reads the pinned commits from the git objects (git cat-file), so a full clone is enough; the clone
      # uses the git login of the runner's machine (both repositories are private). A pin GitHub does not know fails here.
      - name: Fetch the engine sources at the pinned commits
        env:
          CASEDESK_COMMIT: ${{ steps.engine.outputs.casedesk }}
          LIB_COMMIT: ${{ steps.engine.outputs.lib }}
        run: |
          rm -rf engine
          mkdir engine
          git clone --quiet https://github.com/WKDSteve/casedesk.nvim engine/casedesk.nvim
          git clone --quiet https://github.com/WKDSteve/lib.nvim engine/lib.nvim
          git -C engine/casedesk.nvim cat-file -e "${CASEDESK_COMMIT}^{commit}"
          git -C engine/lib.nvim cat-file -e "${LIB_COMMIT}^{commit}"

      # Before the build overwrites them: the committed pages and sums are the build of the sources
      - name: Committed pages match the build
        run: node build/pack.mjs --check

      - name: Build
        run: pnpm build

      # The build must not change a tracked file (pages, SHA256SUMS) nor leave a new one
      - name: Build leaves the tree clean
        run: |
          git status --porcelain --untracked-files=all -- . ':!engine'
          test -z "$(git status --porcelain --untracked-files=all -- . ':!engine')"

      # The size of each page against its budget (build/check-size.mjs)
      - name: Size budget
        run: node build/check-size.mjs

      - name: Test
        run: pnpm test

      # Playwright with the system's Chrome (playwright.config.ts: channel chrome), the pages from disk
      - name: Browser tests
        run: pnpm e2e

      - name: Keep the Playwright traces of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

