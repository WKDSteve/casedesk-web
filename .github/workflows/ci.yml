# Build and check the pages: the committed pages are the build of the sources, the tests in Node, the pages from disk in
# Chrome. The Lua sources come from casedesk.nvim and lib.nvim at the commits of engine.lock.
#
# Actions are pinned by commit (the tag in the comment). Only `push` and manual runs: no `pull_request` trigger, so no
# code from a fork runs here (keep it that way should the job move to a self-hosted runner).
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    # The runner is an open decision (GitHub-hosted Ubuntu or the self-hosted Windows runner); the steps run on both.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CASEDESK_NVIM_DIR: ${{ github.workspace }}/engine/casedesk.nvim
      LIB_NVIM_DIR: ${{ github.workspace }}/engine/lib.nvim
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.28.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Advisory: legacy patterns in the sources (rules-vault web); a finding does not fail the build
      - name: Legacy scan
        continue-on-error: true
        env:
          DISABLE_TELEMETRY: '1'
        run: pnpm exec modern-web-guidance legacy-scan src --json

      # engine.lock is read by the build's own reader, not by a second one here
      - name: Engine commits from engine.lock
        id: engine
        run: |
          node --input-type=module -e "
            import { appendFileSync } from 'node:fs';
            import { readLock } from './build/bundle.mjs';
            const lock = readLock();
            appendFileSync(process.env.GITHUB_OUTPUT, 'casedesk=' + lock.casedesk_commit + '\nlib=' + lock.lib_commit + '\n');
          "

      # The build reads the pinned commits from the git objects; a checkout of exactly that commit holds them.
      # ENGINE_READ_TOKEN (contents: read on both repositories) is needed only while they are private.
      - name: Checkout casedesk.nvim at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WKDSteve/casedesk.nvim
          ref: ${{ steps.engine.outputs.casedesk }}
          path: engine/casedesk.nvim
          token: ${{ secrets.ENGINE_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Checkout lib.nvim at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WKDSteve/lib.nvim
          ref: ${{ steps.engine.outputs.lib }}
          path: engine/lib.nvim
          token: ${{ secrets.ENGINE_READ_TOKEN || github.token }}
          persist-credentials: false

      # Before the build overwrites them: the committed pages and sums are the build of the sources
      - name: Committed pages match the build
        run: node build/pack.mjs --check

      - name: Build
        run: pnpm build

      # The build must not change a tracked file (pages, SHA256SUMS) nor leave a new one
      - name: Build leaves the tree clean
        run: |
          git status --porcelain --untracked-files=all -- . ':!engine'
          test -z "$(git status --porcelain --untracked-files=all -- . ':!engine')"

      - name: Test
        run: pnpm test

      # Playwright with the system's Chrome (playwright.config.ts: channel chrome), the pages from disk
      - name: Browser tests
        run: pnpm e2e

      - name: Keep the Playwright traces of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

